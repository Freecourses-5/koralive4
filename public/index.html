<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كرة لايف</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="brand-logo">⚽</div>
      <strong data-i18n="brand">كرة لايف</strong>
    </div>
    <div class="header-actions">
      <button id="langBtn" class="outline-btn">English</button>
      <button class="icon-btn" aria-label="theme">☾</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow"><span></span><span data-i18n="liveBoard">لوحة النتائج المباشرة</span></div>
        <h1 data-i18n="heroTitle">نتائج مباريات كرة القدم، لحظة بلحظة.</h1>
        <p data-i18n="heroText">تابع مباريات اليوم والنتائج المباشرة ومعلومات المباراة.</p>
      </div>
      <div class="stats-card">
        <strong>202</strong>
        <span data-i18n="todayMatches">مباراة اليوم</span>
        <small>🟢 1 <span data-i18n="liveNow">مباراة مباشرة الآن</span></small>
      </div>
    </section>

    <section class="controls">
      <div class="date-row">
        <button class="nav-btn">‹</button>
        <div class="date">
          <span data-i18n="dateLabel">التاريخ</span>
          <strong id="dateText">Tuesday 18 August</strong>
        </div>
        <button class="nav-btn">›</button>
        <button class="today-btn" data-i18n="today">اليوم</button>
      </div>
      <div class="search">
        <span>⌕</span>
        <input id="searchInput" data-i18n-placeholder="search" placeholder="ابحث عن فريق..." />
      </div>
    </section>

    <div class="tabs">
      <button class="active" data-i18n="all">الكل</button>
      <button data-i18n="favorites">المفضلة</button>
      <button data-i18n="important">أهم المباريات</button>
    </div>

    <section>
      <div class="section-title">
        <div class="eyebrow"><span></span><span data-i18n="matchesCenter">مركز المباريات</span></div>
        <h2 data-i18n="matchesToday">مباريات اليوم</h2>
      </div>

      <div id="leagues"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
